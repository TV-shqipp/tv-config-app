name: Aggiorna link Gjirafa

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

# Evita che due esecuzioni di questo workflow si sovrappongano
concurrency:
  group: update-links
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Estrai i link
        run: python update_gjirafa.py

      - name: Salva se cambiato
        run: |
          if [[ -n "$(git status --porcelain config.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add config.json
            git commit -m "Aggiorna link Gjirafa"
            # Gli altri workflow modificano lo stesso config.json: riallinea e riprova se il push viene rifiutato
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then
                exit 0
              fi
              echo "Push non riuscito (tentativo $attempt/5), riprovo..."
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 5))
            done
            echo "Push fallito dopo 5 tentativi"
            exit 1
          else
            echo "Nessuna modifica"
          fi
