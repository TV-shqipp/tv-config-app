name: Aggiorna Link Debat Plus

on:
  schedule:
    - cron: '30 16,18,20,22 * * *'
  workflow_dispatch:

permissions:
  contents: write 

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Clona il repository
        uses: actions/checkout@v3

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # --- 1. CONFIGURA NODE.JS (Necessario per yt-dlp) ---
      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --- 2. INSTALLA YT-DLP CON LE DIPENDENZE DEFAULT ---
      - name: Installa e aggiorna yt-dlp con le dipendenze default
        run: pip install --upgrade "yt-dlp[default]"

      - name: Crea il file dei cookie dal Secret
        run: echo "${{ secrets.YT_COOKIES }}" > cookies.txt

      - name: Esegui lo script di estrazione
        run: python update_youtube.py

      - name: Salva il nuovo config su GitHub
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add config.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Aggiornato link HLS per Debat Plus"
          git push
