name: Aggiorna ID YouTube Debat Plus

on:
  schedule:
    - cron: '50 18 * * 1-5'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clona il repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa yt-dlp
        run: |
          pip install --upgrade yt-dlp

      - name: Esegui script YouTube
        run: python update_youtube.py

      - name: Salva e carica modifiche su GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # 👇 CONTROLLA QUESTO PERCORSO 👇
          # Se il tuo config.json è in un'altra posizione, cambia questo percorso
          git add app/src/main/assets/config.json
          git commit -m "Aggiornamento automatico ID live YouTube" || echo "Nessuna modifica da committare"
          git push
