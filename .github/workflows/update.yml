name: Aggiorna Link Debat Plus

on:
  schedule:
    # Ore UTC 17-22: coprono 19:30-24:00 italiane sia con ora legale sia con ora solare
    # (la fascia precisa la decide update_youtube.py)
    - cron: '*/5 17-22 * * *'
  workflow_dispatch:

concurrency:
  group: update-debat
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Clona il repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Node.js serve a yt-dlp per risolvere la challenge JS di YouTube
      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          
      - name: Installa yt-dlp e il solver JS
        run: pip install --upgrade "yt-dlp[default]" yt-dlp-ejs

      - name: Crea il file dei cookie dal Secret
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: printf '%s\n' "$YT_COOKIES" > cookies.txt

      - name: Esegui lo script di estrazione
        run: python update_youtube.py

      - name: Salva il nuovo config su GitHub
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add config.json
          if git diff --staged --quiet; then
            echo "Nessuna modifica da committare."
          else
            git commit -m "Aggiornato link HLS per Debat Plus"
            # Gli altri workflow modificano lo stesso config.json: riallinea e riprova se il push viene rifiutato
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then
                exit 0
              fi
              echo "Push non riuscito (tentativo $attempt/5), riprovo..."
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 5))
            done
            echo "Push fallito dopo 5 tentativi"
            exit 1
          fi
