name: Aggiorna Link Debat Plus

on:
  schedule:
    # Esegue alle 16:30, 18:30, 20:30, 22:30 (Ora UTC)
    # Corrisponde circa alle 18:30, 20:30, 22:30, 00:30 in Kosovo
    - cron: '30 16,18,20,22 * * *'
  workflow_dispatch: # Ti permette di avviarlo a mano se serve

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Clona il repository
        uses: actions/checkout@v3

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa yt-dlp
        run: pip install yt-dlp

      - name: Esegui lo script di estrazione
        run: python update_youtube.py

      - name: Salva il nuovo config su GitHub
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add config.json
          # Fa il commit solo se il file è effettivamente cambiato
          git diff --quiet && git diff --staged --quiet || git commit -m "Aggiornato link HLS per Debat Plus"
          git push
