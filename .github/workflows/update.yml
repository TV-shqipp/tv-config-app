name: Aggiorna Link Streaming TV

on:
  schedule:
    - cron: '50 18 * * 1-5'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necessario per permettere al bot di salvare le modifiche sul repository
    steps:
      - name: Clona il repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa yt-dlp
        run: |
          pip install --upgrade yt-dlp

      - name: Esegui script YouTube
        run: python update_youtube.py

      - name: Salva e carica modifiche su GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add config.json
          git commit -m "Aggiornamento automatico link live YouTube" || echo "Nessuna modifica da committare"
          git push
