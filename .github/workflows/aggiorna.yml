name: Aggiorna Stream Gjirafa

on:
  schedule:
    # Esegue ogni 3 ore (allo scatto dello 00, 03,...21 UTC)
    - cron: '0 */3 * * *'
  # Permette di avviare lo script manualmente dalla scheda "Actions"
  workflow_dispatch:

jobs:
  update-links:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necessario per permettere il salvataggio del config.json aggiornato

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Esegui lo script di estrazione
        run: python update_gjirafa.py

      - name: Salva le modifiche su GitHub
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add config.json
          # Fa il commit e il push solo se ci sono modifiche reali
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aggiornamento automatico link Gjirafa" && git push)
