name: Aggiorna Sport (StreameX)

on:
  schedule:
    # Aggiorna lo sport ogni 15 minuti, tutti i giorni
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: update-sport
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-sport:
    runs-on: ubuntu-latest
    steps:
      - name: Clona il repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Esegui lo script Sport
        id: sport
        run: python update_sports.py

      - name: Salva il config su GitHub
        if: steps.sport.outputs.run == 'true'
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add config.json
          if git diff --staged --quiet; then
            echo "Nessuna modifica da committare."
          else
            git commit -m "Aggiornate partite Sport da StreameX"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 5))
            done
            exit 1
          fi
