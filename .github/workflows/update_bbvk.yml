name: Update BBVK Links

on:
  schedule:
    - cron: '*/30 * * * *' # Esegue ogni 30 minuti
  workflow_dispatch: # Permette di avviarlo a mano

jobs:
  update-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Run script
        run: python update_bbvk.py
        
      - name: Commit and push if changed
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add bbvk_live.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update BBVK links" && git push)
